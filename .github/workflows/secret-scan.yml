name: Secret scan

# Fails if a commit adds something that looks like a real secret (API key, token,
# private key). Rules and the reviewed allowlist live in .gitleaks.toml.
# Pull requests and pushes scan only the new commits; the weekly run (and a
# manual run) scans the whole history of every branch.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned by version and checksum (from the project's own checksums.txt),
      # so a changed release asset fails here instead of running.
      - name: Install gitleaks 8.30.0
        run: |
          set -euo pipefail
          V=8.30.0
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --redact keeps any finding's value out of the public log.
          COMMON=(--config .gitleaks.toml --redact=100 --no-banner)
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks git . "${COMMON[@]}" --log-opts="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            gitleaks git . "${COMMON[@]}" --log-opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            gitleaks git . "${COMMON[@]}" --log-opts="--all --remotes"
          fi
