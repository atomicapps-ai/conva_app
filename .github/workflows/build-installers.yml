name: Build installers

# Reusable installer build (SDLC §5.2). Called by:
#   - release.yml  → attaches signed MSI/NSIS/dmg to a DRAFT GitHub Release
#                     **in the public RELEASES_REPOSITORY** (on a tag)
#   - dev-build.yml → uploads beta bundles as workflow artifacts (on push to dev)
# The matrix + Vulkan SDK step live here once so the two callers can't drift.
#
# conva_app (this repo) is private; installers/update manifests/release notes
# are public, so a release run publishes to a separate public repo instead of
# this one — see docs/releasing.md. That needs a cross-repo credential
# (GITHUB_TOKEN only ever reaches the repo the workflow runs in), so release
# runs use the RELEASES_REPO_TOKEN secret + explicit owner/repo instead of the
# default token. Non-release runs (dev-build, workflow_dispatch) never touch
# the releases repo — they keep using the default GITHUB_TOKEN and just build.

env:
  # The public releases repo (installers, update manifests, release notes).
  # Split into owner/name because the `with:` block below needs them separately.
  RELEASES_REPO_OWNER: atomicapps-ai
  RELEASES_REPO_NAME: conva_releases

on:
  workflow_call:
    inputs:
      version:
        description: "Exact version to stamp before building (e.g. 0.2.0-beta.5). Empty = use the committed version."
        type: string
        default: ""
      release:
        description: "true = attach to a draft GitHub Release; false = upload bundles as workflow artifacts."
        type: boolean
        default: false
      tag_name:
        type: string
        default: ""
      release_name:
        type: string
        default: ""
      release_body:
        type: string
        default: ""
    secrets:
      # Master key for the committed env/*.enc files (env/README.md) — the
      # ONE secret this repo's owner has to set in the GitHub UI. Everything
      # it unlocks (TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] today) lives as an
      # encrypted, committed file instead: rotating the signing key from now
      # on is `edit .env.<env>.sec` → `npm run env:encrypt:<env>` → commit,
      # never a return trip to Settings → Secrets. Optional — without it,
      # plain installers still build; only the auto-update packages are
      # skipped (same fallback the old direct secrets gave).
      CONVA_ENV_KEY:
        required: false
      # Fine-grained PAT scoped to ONLY the public RELEASES_REPOSITORY
      # (Contents: Read and write) — lets this build attach installers +
      # latest.json to a release over there instead of in this private repo.
      # Optional here too: a release run without it fails fast at the "Build
      # installers" step with a clear GitHub API auth error rather than
      # silently drafting into the wrong (private) repo. Never required for
      # non-release runs, which don't touch the releases repo at all.
      RELEASES_REPO_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows (GPU / Vulkan)
            args: --features gpu-vulkan
          - platform: macos-latest # Apple Silicon runner
            name: macOS (GPU / Metal)
            args: --features gpu-metal
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    # GitHub Actions forbids the `secrets` context inside an `if:` conditional
    # (job- or step-level) — using it there is a workflow-file validation
    # error, not a YAML syntax error: the run shows zero jobs and fails
    # instantly, before anything is scheduled (the v0.3.2 tag's first attempt
    # hit exactly this). The documented workaround: mirror the secret into a
    # job-level env var — env: assignment isn't an `if:` expression, so this
    # is allowed — and gate on `env.*` instead of `secrets.*` below.
    env:
      CONVA_ENV_KEY: ${{ secrets.CONVA_ENV_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Beta/dev builds pass an explicit -beta.N version to stamp (build-time
      # only — never committed). Release builds pass nothing and use the
      # committed version the tag already guards (release.yml version-guard).
      - name: Stamp version
        if: inputs.version != ''
        run: node scripts/version.mjs set "${{ inputs.version }}"

      # whisper.cpp's Vulkan backend needs the SDK (glslc + headers) at
      # BUILD time only; end users just need a normal graphics driver.
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # LunarG's "latest" alias — pinned version URLs rot as releases
          # cycle (a stale pin returns a tiny error body, not an installer).
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          $exe = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          curl.exe --retry 3 -L -o $exe $url
          $size = (Get-Item $exe).Length
          if ($size -lt 50MB) { throw "Vulkan SDK download looks wrong ($size bytes) — not an installer" }
          Start-Process -FilePath $exe `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name | Select-Object -Last 1).FullName
          if (-not $sdk) { throw "Vulkan SDK install dir not found under C:\VulkanSDK" }
          Write-Host "Vulkan SDK at $sdk"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"

      - run: npm ci

      # Decrypt the committed env/*.enc secrets (env/README.md) straight into
      # $GITHUB_ENV, so "Build installers" below can read them without ever
      # printing them to the log. A release run is always `prod`; dev-build
      # and workflow_dispatch runs use `dev` — same TAURI_SIGNING_PRIVATE_KEY
      # value either way today (.env.dev.sec/.env.prod.sec share one keypair,
      # per those files' own comment: the updater pubkey in tauri.conf.json is
      # fixed, so the private key must match across envs), kept per-env for
      # when that stops being true. `if: env.CONVA_ENV_KEY != ''` (NOT
      # `secrets.CONVA_ENV_KEY` — GitHub Actions forbids the `secrets`
      # context inside any `if:`, see the job-level `env:` above) makes this
      # optional during rollout — no key set yet just means unsigned
      # installers, exactly the old secrets-unset fallback. CONVA_ENV_KEY is
      # already in this step's environment via the job-level `env:`.
      - name: Decrypt signing secrets (env/*.enc)
        if: env.CONVA_ENV_KEY != ''
        shell: bash
        run: node env/cli.mjs print ${{ inputs.release && 'prod' || 'dev' }} >> "$GITHUB_ENV"

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          # Release runs publish cross-repo (see the top-of-file note) and need
          # a PAT that can write releases in RELEASES_REPOSITORY; the default
          # GITHUB_TOKEN can only ever act on the repo the workflow runs in, so
          # it's used as-is for non-release runs, which don't publish anywhere.
          GITHUB_TOKEN: ${{ inputs.release && secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # On a release the tag drives the GitHub Release, created in the
          # public RELEASES_REPOSITORY (owner/repo below) instead of this
          # private repo; otherwise these are all empty and tauri-action just
          # builds (bundles uploaded below).
          owner: ${{ inputs.release && env.RELEASES_REPO_OWNER || '' }}
          repo: ${{ inputs.release && env.RELEASES_REPO_NAME || '' }}
          tagName: ${{ inputs.release && inputs.tag_name || '' }}
          releaseName: ${{ inputs.release && inputs.release_name || '' }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.release }}
          args: ${{ matrix.args }}

      # Non-release (dev/beta or workflow_dispatch) builds keep the bundles as
      # inspectable/downloadable workflow artifacts.
      - name: Upload bundles as workflow artifacts
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app/**
          if-no-files-found: warn
