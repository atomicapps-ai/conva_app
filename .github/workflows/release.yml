name: Release

# Tag a version to ship installers:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Windows installers (MSI + NSIS, GPU/Vulkan whisper) and the
# macOS app/dmg (Metal whisper, Apple Silicon), and attaches everything to a
# DRAFT GitHub Release for the owner to review and publish.
#
# Code signing is not wired yet: Windows installs show a SmartScreen
# "unrecognized app" prompt, and macOS users must right-click → Open the
# first time (unsigned/un-notarized build).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows (GPU / Vulkan)
            args: --features gpu-vulkan
          - platform: macos-latest # Apple Silicon runner
            name: macOS (GPU / Metal)
            args: --features gpu-metal
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # whisper.cpp's Vulkan backend needs the SDK (glslc + headers) at
      # BUILD time only; end users just need a normal graphics driver.
      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # LunarG's "latest" alias — pinned version URLs rot as releases
          # cycle (a stale pin returns a tiny error body, not an installer).
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
          $exe = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          curl.exe --retry 3 -L -o $exe $url
          $size = (Get-Item $exe).Length
          if ($size -lt 50MB) { throw "Vulkan SDK download looks wrong ($size bytes) — not an installer" }
          Start-Process -FilePath $exe `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name | Select-Object -Last 1).FullName
          if (-not $sdk) { throw "Vulkan SDK install dir not found under C:\VulkanSDK" }
          Write-Host "Vulkan SDK at $sdk"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"

      - run: npm ci

      - name: Build and attach installers to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (auto-update feed). Until the
          # TAURI_SIGNING_PRIVATE_KEY secret is added, plain installers
          # still build — only the update packages are skipped.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('convasist {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}

      # workflow_dispatch runs (no tag) still produce inspectable bundles.
      - name: Upload bundles as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app/**
          if-no-files-found: warn
