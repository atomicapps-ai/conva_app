# cliff.toml — git-cliff config for conva's release notes / CHANGELOG.
#
# The generated notes ARE the "release message" the user sees (SDLC §3.2/§4.3):
# the release pipeline runs `git-cliff` between the previous tag and the new one
# to produce both the GitHub Release body and CHANGELOG.md, and the app's
# "What's New" view renders the same notes.
#
# git-cliff is a CI/dev tool (a single static binary) — it is NOT an app runtime
# dependency, so the zero-runtime-dep ethos holds. It reads Conventional-Commit
# subjects, which the `version-check` PR job enforces (SDLC §3.1).
#
# Usage:
#   git-cliff --latest            # notes for the most recent tag (release body)
#   git-cliff -o CHANGELOG.md     # regenerate the full changelog
#   git-cliff --unreleased        # preview notes for commits since the last tag

[changelog]
# Rendered once at the top of CHANGELOG.md.
header = """
# Changelog

All notable changes to **conva** are documented here. This file is generated
from [Conventional Commits](https://www.conventionalcommits.org) by git-cliff —
do not edit it by hand.\n
"""

# The per-release template (Tera). Grouped, newest first, with commit links.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]{% if release_link %}({{ release_link }}){% endif %} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif %}\
{% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/atomicapps-ai/conva_app/commit/{{ commit.id }})){% endif %}
{% endfor %}\
{% endfor %}\n
"""

# Note: footer/trim below are part of [changelog] (this same table) — a former
# `[changelog.macros]` header here silently moved them (plus a `postprocessors`
# entry) into an unrecognized table that git-cliff just ignored (no error,
# since it's not a real git-cliff config field). The postprocessor was trying
# to turn a `${self::commit_base()}` placeholder into a real GitHub commit
# URL, but `body` above actually called `{{ self::commit_base() }}` — real
# Tera macro-call syntax, not a literal placeholder — which fails template
# rendering outright ("Macro namespace `self` was not found") since no such
# macro was ever defined; the postprocessor (even placed correctly) would
# never have run. Fixed by inlining the URL directly in `body` above instead
# of routing through an undefined macro + a placeholder-substitution that
# can't match real template output. Found via the v0.2.0/v0.3.0
# release-pipeline test runs, both of which failed before this was reached.
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# Non-conventional commits are dropped from user-facing notes (they're usually
# WIP/merge noise); the version-check job keeps real PRs conventional.
filter_unconventional = true
filter_commits = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"

# Map commit types → release-note sections. Order here = order in the notes.
# Types NOT listed (chore, ci, build, test, style) are skipped from the
# user-facing release message on purpose — they're internal.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^(chore|ci|build|test|style)", skip = true },
  { message = ".*", skip = true },
]

# No commit_preprocessors needed: the "<!-- N -->" sort prefixes above only
# ever land in `group` (used for ordering), never in the commit message body,
# and the `body` template already strips them from the rendered group heading
# via `| striptags`. (A prior empty `[git.commit_preprocessors]` table here —
# TOML's table syntax, not the array-of-tables `[[...]]` git-cliff actually
# requires for this key — broke every git-cliff invocation with "invalid
# type: map, expected a sequence for key `git.commit_preprocessors`"; found
# via the v0.2.0/v0.3.0 release-pipeline test runs, both of which failed here
# before ever reaching the install matrix.)
