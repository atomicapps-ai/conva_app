[package]
name = "conva-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# `.cva` archive path-collision defense: two visually/structurally distinct
# entry names can normalize to the same Unicode form (NFC/NFD), which some
# filesystems (notably macOS HFS+/APFS) silently fold on write. Detecting that
# at manifest-validation time (archive.rs) is cross-platform and needs no
# filesystem access.
unicode-normalization = "0.1"
# `.cva` archive checksums (manifest + whole-archive digest). Pure byte
# hashing, no OS access — safe on every target this crate builds for,
# including wasm32 (Checkpoint E).
sha2 = "0.10"
# `.cva` ZIP container read/write (Checkpoint E: moved here from
# `src-tauri/src/archive.rs` so the exact same reader/writer serves both the
# desktop adapter and the wasm32 web adapter — one archive implementation,
# not a parallel "web dialect"). `deflate` only (matches the desktop
# adapter's prior feature set exactly): no `aes-crypto`/`bzip2`/`zstd`, and
# critically no `zlib`/`zlib-ng` C backend — `flate2`'s default Rust
# (`miniz_oxide`) backend is what keeps this wasm32-unknown-unknown-safe.
zip = { version = "2", default-features = false, features = ["deflate"] }
