# osv-scanner configuration (used by .github/workflows/dependency-audit.yml).
# Every entry is a reviewed decision: what it is, why it is acceptable for now,
# and a date after which the scan fails again so the decision is re-made, not forgotten.
# Added 2026-10-05 from the pre-release security audit
# (conva_core docs/technical/2026-10-pre-release-security-audit.md).

# --- Vulnerabilities we cannot fix yet --------------------------------------

[[IgnoredVulns]]
id = "RUSTSEC-2026-0187"
ignoreUntil = 2027-01-05
reason = "lopdf 0.34 (via pdf-extract 0.7): stack overflow on deeply nested PDF objects. A crafted PDF added to the Library can crash the app; no data exposure. No compatible update: needs a pdf-extract major upgrade."

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-01-05
reason = "glib 0.18.5 (unsound iterator; also RUSTSEC-2024-0429): only built for Linux/GTK; not in the Windows or macOS app. Tracked for any Linux build."

